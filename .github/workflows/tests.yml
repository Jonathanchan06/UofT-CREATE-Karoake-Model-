name: tests

# CI: runs on every push and pull request. A red X means a change broke something.
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # basic-pitch is left out here on purpose (heavy); its test skips itself in CI
      - run: pip install -r ml/requirements.txt -r scorer/requirements.txt librosa pretty_midi soundfile
      - run: python -m pytest ml scorer melody pipeline
